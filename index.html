<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتاق میتینگ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="میتینگ">
<style>
:root{--bg:#14181f;--panel:#1d232d;--ink:#e8ecf2;--mute:#8d98a8;--accent:#3ea6a0;--danger:#d9534f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif}
[hidden]{display:none!important}
#lobby{max-width:420px;margin:0 auto;padding:12vh 20px 20px}
#lobby h1{font-size:28px;margin:0 0 6px}
#lobby p{color:var(--mute);margin:0 0 28px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2f3846;background:var(--panel);color:var(--ink);font:inherit;margin-bottom:12px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#06201f;font:inherit;font-weight:700;cursor:pointer}
.or{display:flex;gap:8px;margin-top:22px}
.or input{margin:0}
.or button{padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:none;color:var(--accent);font:inherit;cursor:pointer;white-space:nowrap}
#err{color:#f0a19e;min-height:22px;margin-top:14px;font-size:14px}
#room{height:100%;display:flex;flex-direction:column}
#grid{flex:1;min-height:0;display:grid;gap:8px;padding:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:1fr}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:140px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:6px;font-size:13px}
#bar{display:flex;justify-content:center;gap:10px;padding:12px;background:var(--panel);flex-wrap:wrap}
#bar button{padding:11px 16px;border-radius:24px;border:0;background:#2c3542;color:var(--ink);font:inherit;cursor:pointer}
#bar button.off{background:var(--danger)}
#bar button.on{background:var(--accent);color:#06201f}
#bar #leave{background:var(--danger)}
</style>
</head>
<body>
<div id="lobby">
  <h1>اتاق میتینگ</h1>
  <p>تماس تصویری گروهی، مستقیم در مرورگر.</p>
  <input id="name" placeholder="نام شما" maxlength="24">
  <button class="primary" id="newBtn">شروع جلسه جدید</button>
  <div class="or">
    <input id="code" placeholder="کد یا لینک جلسه" dir="ltr">
    <button id="joinBtn">ورود</button>
  </div>
  <div id="err" role="alert"></div>
</div>

<div id="room" hidden>
  <div id="grid"></div>
  <div id="bar">
    <button id="mic">میکروفون</button>
    <button id="cam">دوربین</button>
    <button id="share">اشتراک صفحه</button>
    <button id="copy">کپی لینک جلسه</button>
    <button id="leave">خروج</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PRE = 'mtgroom-';
let peer, local, code, name, screen = null;
const calls = {}, names = {};

function genCode(){
  const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
  for (let i = 0; i < 9; i++){ s += c[Math.random() * c.length | 0]; if (i % 3 == 2 && i < 8) s += '-'; }
  return s;
}
function parseCode(v){ v = v.trim(); return (v.includes('#') ? v.split('#').pop() : v).toLowerCase(); }
function showErr(m){ $('err').textContent = m; }

function addTile(id, stream, label, muted){
  let t = $('t-' + id);
  if (!t){
    t = document.createElement('div'); t.className = 'tile'; t.id = 't-' + id;
    t.innerHTML = '<video autoplay playsinline></video><span></span>';
    $('grid').appendChild(t);
  }
  const v = t.querySelector('video'); v.srcObject = stream; v.muted = !!muted;
  t.querySelector('span').textContent = label;
}
function removeTile(id){
  const t = $('t-' + id); if (t) t.remove();
  delete calls[id];
}

function hook(c, nm){
  calls[c.peer] = c; names[c.peer] = nm;
  c.on('stream', s => addTile(c.peer, s, nm));
  c.on('close', () => removeTile(c.peer));
  c.on('error', () => removeTile(c.peer));
  const pc = c.peerConnection;
  if (pc) pc.addEventListener('iceconnectionstatechange', () => {
    if (['failed', 'closed', 'disconnected'].includes(pc.iceConnectionState)) setTimeout(() => {
      if (['failed', 'closed', 'disconnected'].includes(pc.iceConnectionState)) removeTile(c.peer);
    }, 4000);
  });
}
function callPeer(id, nm){
  if (calls[id] || id === peer.id) return;
  hook(peer.call(id, local, { metadata: { name } }), nm);
}

async function enter(c, host){
  name = $('name').value.trim() || 'مهمان';
  try { local = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
  catch (e) {
    try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e2) { local = new MediaStream(); }
  }
  code = c; location.hash = c;
  $('lobby').hidden = true; $('room').hidden = false;
  addTile('me', local, name + ' (شما)', true);
  connect(host);
}

function connect(host){
  peer = new Peer(host ? PRE + code : undefined);
  peer.on('call', c => { c.answer(local); hook(c, (c.metadata && c.metadata.name) || 'مهمان'); });

  if (host){
    peer.on('connection', conn => {
      conn.on('data', d => {
        if (d && d.type === 'hello') conn.send({
          type: 'peers', host: name,
          list: Object.keys(calls).map(id => ({ id, name: names[id] }))
        });
      });
    });
  }
  peer.on('open', id => {
    if (host) return;
    const conn = peer.connect(PRE + code);
    conn.on('open', () => conn.send({ type: 'hello', id }));
    conn.on('data', d => {
      if (d && d.type === 'peers'){
        d.list.forEach(p => callPeer(p.id, p.name));
        callPeer(PRE + code, d.host);
      }
    });
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id'){ peer.destroy(); connect(false); }
    else if (e.type === 'peer-unavailable'){ alert('جلسه پیدا نشد یا میزبان خارج شده است.'); location.hash = ''; location.reload(); }
  });
}

function swapVideo(track){
  Object.values(calls).forEach(c => {
    const s = c.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
    if (s) s.replaceTrack(track);
  });
}
async function toggleShare(){
  if (screen) return stopShare();
  try { screen = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch (e) { return; }
  const t = screen.getVideoTracks()[0];
  swapVideo(t); t.onended = stopShare;
  addTile('me', screen, name + ' (شما)', true);
  $('share').classList.add('on');
}
function stopShare(){
  if (!screen) return;
  screen.getTracks().forEach(t => t.stop()); screen = null;
  const cam = local.getVideoTracks()[0]; if (cam) swapVideo(cam);
  addTile('me', local, name + ' (شما)', true);
  $('share').classList.remove('on');
}
function toggleTrack(kind, btn){
  const ts = kind === 'audio' ? local.getAudioTracks() : local.getVideoTracks();
  if (!ts.length) return;
  const on = !ts[0].enabled; ts.forEach(t => t.enabled = on);
  btn.classList.toggle('off', !on);
}

$('newBtn').onclick = () => enter(genCode(), true);
$('joinBtn').onclick = () => { const c = parseCode($('code').value); if (!c) return showErr('کد جلسه را وارد کنید.'); enter(c, false); };
$('mic').onclick = e => toggleTrack('audio', e.currentTarget);
$('cam').onclick = e => toggleTrack('video', e.currentTarget);
$('share').onclick = toggleShare;
$('copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => { $('copy').textContent = 'کپی شد'; setTimeout(() => $('copy').textContent = 'کپی لینک جلسه', 1500); });
$('leave').onclick = () => { if (peer) peer.destroy(); if (local) local.getTracks().forEach(t => t.stop()); location.hash = ''; location.reload(); };

if (location.hash.length > 1) $('code').value = location.hash.slice(1);
</script>
</body>
</html>
